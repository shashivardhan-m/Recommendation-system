<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard – Generative AI Recommendation Systems</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-light: #3b82f6;
            --accent: #6d28d9;
            --accent-light: #8b5cf6;
            --bg: #0a0f1e;
            --surface: rgba(255, 255, 255, 0.04);
            --surface-hover: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.1);
            --text: #f1f5f9;
            --text-muted: #94a3b8;
            --amber: #f59e0b;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.7;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            background: linear-gradient(135deg, #1e3a8a 0%, #7c3aed 100%);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 32px rgba(124, 58, 237, 0.35);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 3rem;
            max-width: 1400px;
            margin: 0 auto;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: #fff;
            text-decoration: none;
        }

        .nav-brand-icon {
            width: 38px;
            height: 38px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(8px);
        }

        .nav-brand h1 {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            line-height: 1.2;
        }

        .admin-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid rgba(245, 158, 11, 0.25);
            padding: 0.2rem 0.6rem;
            border-radius: 999px;
            font-size: 0.65rem;
            font-weight: 700;
            color: #fcd34d;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            white-space: nowrap;
        }

        .navbar ul {
            list-style: none;
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .navbar ul li a {
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            padding: 0.5rem 1rem;
            border-radius: 9px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .navbar ul li a:hover {
            background: rgba(255, 255, 255, 0.22);
            transform: translateY(-1px);
        }

        .navbar ul li a.logout {
            background: rgba(239, 68, 68, 0.15);
            border-color: rgba(239, 68, 68, 0.3);
            color: #fca5a5;
        }

        .navbar ul li a.logout:hover {
            background: rgba(239, 68, 68, 0.25);
        }

        .container {
            max-width: 1400px;
            margin: 2.5rem auto;
            padding: 0 2rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .form-section,
        .output-section,
        .table-section {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 2.5rem;
            border-radius: 16px;
            transition: all 0.3s ease;
        }

        .form-section:hover,
        .output-section:hover,
        .table-section:hover {
            background: var(--surface-hover);
            transform: translateY(-3px);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.3);
            border-color: rgba(124, 58, 237, 0.25);
        }

        .form-section h2,
        .output-section h2,
        .table-section h2 {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 1.5rem;
        }

        /* Table */
        .table-section table {
            width: 100%;
            border-collapse: collapse;
        }

        .table-section th,
        .table-section td {
            padding: 0.9rem 1rem;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 0.875rem;
        }

        .table-section th {
            background: rgba(124, 58, 237, 0.1);
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            font-size: 0.72rem;
            letter-spacing: 0.07em;
        }

        .table-section tr:hover td {
            background: rgba(255, 255, 255, 0.03);
        }

        textarea,
        select,
        input[type="file"] {
            width: 100%;
            padding: 0.8rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            color: var(--text);
            transition: all 0.3s ease;
            margin-bottom: 1rem;
        }

        textarea:focus,
        select:focus,
        input[type="file"]:focus {
            border-color: var(--accent-light);
            box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.2);
            outline: none;
        }

        button {
            background: linear-gradient(135deg, var(--primary-light), var(--accent));
            color: #fff;
            padding: 0.8rem 1.75rem;
            border: none;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(109, 40, 217, 0.4);
            filter: brightness(1.1);
        }

        .error {
            color: #fca5a5;
            padding: 0.9rem 1rem;
            background: rgba(239, 68, 68, 0.1);
            border-radius: 10px;
            border: 1px solid rgba(239, 68, 68, 0.25);
            margin-bottom: 1rem;
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            background: rgba(0, 0, 0, 0.3);
            border-top: 1px solid rgba(255, 255, 255, 0.07);
            color: #475569;
            font-size: 0.82rem;
            margin-top: auto;
        }

        @media (max-width: 768px) {
            .navbar {
                padding: 1rem 1.5rem;
                flex-direction: column;
            }

            .container {
                padding: 0 1rem;
                margin: 1.5rem auto;
            }
        }
    </style>
</head>

<body>
    <header>
        <nav class="navbar">
            <a href="{% url 'index' %}" class="nav-brand">
                <div class="nav-brand-icon">🛡️</div>
                <h1>Admin Dashboard &nbsp;<span class="admin-badge">🔐 Admin</span></h1>
            </a>
            <ul>
                <li><a href="{% url 'AdminHome' %}">🏠 Home</a></li>
                <li><a href="{% url 'RegisterUsersView' %}">👥 User Details</a></li>
                <li><a href="{% url 'base' %}" class="logout">↩ Logout</a></li>
            </ul>
        </nav>
    </header>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>

    <footer>
        <p>© 2025 Generative AI Recommendation Systems – Admin Panel. All rights reserved.</p>
    </footer>
</body>

</html>
