{% extends 'base.html' %}

{% block hero %}{% endblock %}

{% block content %}
<style>
    .auth-wrapper {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 60vh;
        padding: 2rem 1rem;
    }

    .auth-card {
        width: 100%;
        max-width: 460px;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(20px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        padding: 2.5rem;
        box-shadow: 0 32px 80px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        animation: cardIn 0.5s cubic-bezier(0.4, 0, 0.2, 1) both;
    }

    @keyframes cardIn {
        from {
            opacity: 0;
            transform: translateY(24px) scale(0.97);
        }

        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    .auth-header {
        text-align: center;
        margin-bottom: 2rem;
    }

    .auth-icon {
        width: 60px;
        height: 60px;
        background: linear-gradient(135deg, #3b82f6, #6d28d9);
        border-radius: 18px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.75rem;
        margin: 0 auto 1rem;
        box-shadow: 0 8px 24px rgba(109, 40, 217, 0.4);
    }

    .auth-header h2 {
        font-size: 1.75rem;
        font-weight: 700;
        color: #f1f5f9;
        margin-bottom: 0.3rem;
    }

    .auth-header p {
        font-size: 0.875rem;
        color: #94a3b8;
    }

    .form-group {
        margin-bottom: 1.25rem;
        position: relative;
    }

    .form-group label {
        display: block;
        font-size: 0.8rem;
        font-weight: 600;
        color: #94a3b8;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        margin-bottom: 0.5rem;
    }

    .form-group input {
        width: 100%;
        padding: 0.8rem 1rem;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 12px;
        font-size: 0.95rem;
        font-family: 'Inter', sans-serif;
        color: #f1f5f9;
        transition: all 0.3s ease;
    }

    .form-group input:focus {
        border-color: #8b5cf6;
        box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.25);
        background: rgba(255, 255, 255, 0.1);
        outline: none;
    }

    .form-group input::placeholder {
        color: #475569;
    }

    .password-wrapper {
        position: relative;
    }

    .password-wrapper input {
        padding-right: 3rem;
    }

    .toggle-pw {
        position: absolute;
        right: 0.9rem;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        cursor: pointer;
        color: #64748b;
        font-size: 1.1rem;
        padding: 0.2rem;
        transition: color 0.2s;
        line-height: 1;
    }

    .toggle-pw:hover {
        color: #8b5cf6;
        transform: translateY(-50%) scale(1.1);
        box-shadow: none;
    }

    .btn-auth {
        width: 100%;
        padding: 0.9rem;
        background: linear-gradient(135deg, #3b82f6, #6d28d9);
        color: #fff;
        border: none;
        border-radius: 12px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        font-family: 'Inter', sans-serif;
        margin-top: 0.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
    }

    .btn-auth:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 28px rgba(109, 40, 217, 0.5);
        filter: brightness(1.08);
    }

    .btn-auth:active {
        transform: translateY(0);
    }

    .auth-footer-link {
        text-align: center;
        margin-top: 1.5rem;
        font-size: 0.875rem;
        color: #64748b;
    }

    .auth-footer-link a {
        color: #8b5cf6;
        font-weight: 500;
        text-decoration: none;
        transition: color 0.2s;
    }

    .auth-footer-link a:hover {
        color: #a78bfa;
    }

    .message-alert {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.8rem 1rem;
        background: rgba(239, 68, 68, 0.12);
        border: 1px solid rgba(239, 68, 68, 0.3);
        border-radius: 10px;
        color: #fca5a5;
        font-size: 0.875rem;
        margin-top: 1rem;
        animation: fadeUp 0.3s ease both;
    }

    @keyframes fadeUp {
        from {
            opacity: 0;
            transform: translateY(6px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-icon">👤</div>
            <h2>Welcome back</h2>
            <p>Sign in to access your dashboard</p>
        </div>

        <form method="POST" action="{% url 'UserLoginCheck' %}">
            {% csrf_token %}
            <div class="form-group">
                <label for="loginid">Login ID</label>
                <input type="text" name="loginid" id="loginid" placeholder="Enter your login ID" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" name="password" id="password" placeholder="Enter your password" required>
                    <button type="button" class="toggle-pw" onclick="togglePw('password', this)"
                        title="Show/hide password">👁</button>
                </div>
            </div>
            <button type="submit" class="btn-auth">🚀 Sign In</button>

            {% if messages %}
            {% for message in messages %}
            <div class="message-alert">⚠️ {{ message }}</div>
            {% endfor %}
            {% endif %}
        </form>

        <div class="auth-footer-link">
            Don't have an account? <a href="{% url 'register' %}">Create one →</a>
        </div>
    </div>
</div>

<script>
    function togglePw(fieldId, btn) {
        const input = document.getElementById(fieldId);
        if (input.type === 'password') {
            input.type = 'text';
            btn.textContent = '🙈';
        } else {
            input.type = 'password';
            btn.textContent = '👁';
        }
    }
</script>
{% endblock %}
